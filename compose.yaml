# PostgreSQL and the connector. `make dev` starts only postgres and runs the
# binary on this machine; `make up` starts both. Settings come from .env,
# which the Makefile creates. Ports are published on 127.0.0.1 only.

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    environment:
      POSTGRES_USER: gtm
      POSTGRES_DB: gtm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make, which creates .env}
      # C collation, so text compares byte by byte as the oracle's SQLite does.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 127.0.0.1:${GTM_DB_PORT:-55432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gtm -d gtm]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint changes the data folder's owner, then drops to postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  app:
    build:
      context: .
    image: gtm-connector:local
    command: [serve]
    # The same user as on this machine, so the credentials folder it shares
    # passes the ownership check on both sides.
    user: ${GTM_UID:?run make, which creates .env}:${GTM_GID:?run make, which creates .env}
    environment:
      GTM_DATABASE_URL: postgres://gtm:${POSTGRES_PASSWORD}@postgres:5432/gtm?sslmode=disable
      GTM_CREDENTIALS_DIR: /state/credentials
      GTM_LISTEN: 0.0.0.0:8443
      GTM_PUBLIC_ORIGIN: https://127.0.0.1:${GTM_PORT:-8443}
      GTM_ALLOWED_HOSTS: 127.0.0.1:${GTM_PORT:-8443},localhost:${GTM_PORT:-8443}
      GTM_WEB_DIR: /app/web
    volumes:
      # The folder that holds credentials/ and backups/, mounted whole: a
      # mount point itself shows as root-owned inside the container.
      - ${GTM_HOME:?run make, which creates .env}:/state
    ports:
      - 127.0.0.1:${GTM_PORT:-8443}:8443
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/gtm-connector, health]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening

volumes:
  pgdata:
