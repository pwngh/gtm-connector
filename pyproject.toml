[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-connector"
description = "Create cited renewal briefs from scoped CRM, call, and Slack reads."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version", "dependencies"]

[project.scripts]
gtm-connector = "gtm_connector.cli:main"

[project.urls]
Repository = "https://github.com/pwngh/gtm-connector"
Documentation = "https://github.com/pwngh/gtm-connector#readme"
Issues = "https://github.com/pwngh/gtm-connector/issues"

[tool.setuptools]
packages = ["gtm_connector"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "gtm_connector.__version__"}
dependencies = {file = ["requirements.in"]}

[tool.ruff]
line-length = 120
target-version = "py311"
# Preserve the existing behavioral tests during this tooling-only slice.
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

[tool.mypy]
python_version = "3.11"
files = ["gtm_connector", "tools"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
