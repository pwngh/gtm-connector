name: Test connector demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The pinned PostgreSQL, and the fallback one major version back.
        postgres:
          - postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
          - postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: gtm
          POSTGRES_DB: gtm
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        # Trust authentication, so the port answers on the runner's loopback only.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm -d gtm"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GTM_TEST_DATABASE_URL: postgres://gtm@localhost:5432/gtm?sslmode=disable
      GTM_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned patch (pins.json), never the newest of a range.
          go-version: '1.27.4'
      - run: |
          go vet ./...
          go test -race -count=1 ./...

  # Compose end to end, on the pinned PostgreSQL and the fallback: the image
  # builds with its commit, setup runs as the owner, the server starts as the
  # app role, TLS health and demo sign-in work, and a published card keeps
  # its digest across a restart and across a backup, clean and restore.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['19.0', '18.7']
    env:
      POSTGRES: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      - run: scripts/smoke.sh
      - name: A card reads the same after a restart
        run: |
          scripts/smoke.sh demo
          scripts/smoke.sh card | tee "$RUNNER_TEMP/card"
          make down up
          scripts/smoke.sh card | diff "$RUNNER_TEMP/card" -
      - name: A backup restores the card and the demo sign-in into a clean database
        run: |
          make backup
          backup="$(ls -t "$(sed -n 's/^GTM_HOME=//p' .env)/backups" | head -n 1)"
          make clean
          make restore BACKUP="$backup"
          make up
          scripts/smoke.sh
          scripts/smoke.sh card | diff "$RUNNER_TEMP/card" -
      - name: make -n prints no password
        run: |
          for key in POSTGRES_PASSWORD GTM_APP_PASSWORD; do
            secret="$(sed -n "s/^$key=//p" .env)"
            if make -n dev test up backup restore BACKUP=x | grep -qF "$secret"; then exit 1; fi
          done
      - if: failure()
        run: docker compose logs --no-color

  # The pinned Inspector CLI against the binary, on the pinned PostgreSQL: setup, demo and token new, then
  # serve's /mcp over HTTPS with each token, and mcp stdio started by the Inspector. The same sequence runs
  # against the gate in process.
  inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
        env:
          POSTGRES_USER: gtm
          POSTGRES_DB: gtm
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        # Trust authentication, so the port answers on the runner's loopback only.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm -d gtm"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GTM_TEST_DATABASE_URL: postgres://gtm@localhost:5432/gtm?sslmode=disable
      GTM_REQUIRE_DATABASE: '1'
      GTM_INSPECTOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned patch (pins.json), never the newest of a range.
          go-version: '1.27.4'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - run: go test -count=1 -run '^TestInspector$' -v ./cmd/gtm-connector ./internal/transport/mcp

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned patch (pins.json), never the newest of a range.
          go-version: '1.27.4'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: The build inside the binary serves its page at each deep link, and the assets it names
        working-directory: .
        env:
          GTM_REQUIRE_WEB_BUILD: '1'
        run: go test -count=1 -run '^TestTheBuildInTheBinaryIsServed$' -v ./internal/transport/http
      - name: The release target builds four binaries with this web app inside them, and their sums match
        working-directory: .
        run: make release

  # The browser checks against the build and a stub of the API, in the Chromium build pinned by
  # playwright-core: every page at 320, 390, 768 and 1440 wide, light and dark. Any failed check fails
  # the job, and its screenshots are kept.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: The playwright-core version names the browser build
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install the pinned Chromium and the system libraries it needs
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
      - name: The browser checks, every page at each width and theme
        run: npm run test:browser -- --channel chromium --screenshots "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
