name: Test connector demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          .venv/bin/python -m pip check
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy
      - name: Check all shell completion scripts
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fish zsh
          GTM_REQUIRE_SHELLS=1 .venv/bin/python -m unittest discover -s tests -p test_completion.py -v
      - name: Check the installed command outside the checkout
        run: |
          .venv/bin/python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
          .venv/bin/python -m pip install --no-deps "$RUNNER_TEMP"/wheels/gtm_connector-*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/gtm-connector" --version
          "$GITHUB_WORKSPACE/.venv/bin/python" -m gtm_connector --help
          "$GITHUB_WORKSPACE/.venv/bin/gtm-connector" demo --json > installed-demo.json
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import json; r=json.load(open("installed-demo.json")); assert r["status"] == "accepted" and r["account"]["id"] == "acc-003" and r["audit"]["rows"] == 7 and r["activities_created"] == 0 and r["brief"]["text"].startswith("DEAL CARD")'
          "$GITHUB_WORKSPACE/.venv/bin/gtm-connector" debug verify --json --state-dir installed-verification > installed-verification.json
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import json; r=json.load(open("installed-verification.json")); assert r["accounts"] == 30 and r["audit_rows"] == 12 and r["brief_audit_rows"] == 9 and r["idempotent_write"]["activities"] == 1'
      - name: Check generated audit sequences
        run: .venv/bin/python -m unittest discover -s tests_stateful -v

  test:
    runs-on: ubuntu-latest
    # The suite starts a local server for each end-to-end case and takes up to fifteen minutes here.
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.14.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: ./scripts/demo.sh
        env:
          GTM_REQUIRE_ORACLE: ${{ matrix.python-version == '3.14.6' && '1' || '' }}

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The pinned PostgreSQL, and the fallback one major version back.
        postgres:
          - postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
          - postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: gtm
          POSTGRES_DB: gtm
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        # Trust authentication, so the port answers on the runner's loopback only.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm -d gtm"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GTM_TEST_DATABASE_URL: postgres://gtm@localhost:5432/gtm?sslmode=disable
      GTM_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned patch (pins.json), never the newest of a range.
          go-version: '1.27.4'
      - run: |
          go vet ./...
          go test -race -count=1 ./...

  # Compose end to end, on the pinned PostgreSQL and the fallback: the image
  # builds with its commit, setup runs as the owner, the server starts as the
  # app role, TLS health and demo sign-in work, and a published card keeps
  # its digest across a restart and across a backup, clean and restore.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['19.0', '18.7']
    env:
      POSTGRES: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      - run: scripts/smoke.sh
      - name: A card reads the same after a restart
        run: |
          scripts/smoke.sh demo
          scripts/smoke.sh card | tee "$RUNNER_TEMP/card"
          make down up
          scripts/smoke.sh card | diff "$RUNNER_TEMP/card" -
      - name: A backup restores the card and the demo sign-in into a clean database
        run: |
          make backup
          backup="$(ls -t "$(sed -n 's/^GTM_HOME=//p' .env)/backups" | head -n 1)"
          make clean
          make restore BACKUP="$backup"
          make up
          scripts/smoke.sh
          scripts/smoke.sh card | diff "$RUNNER_TEMP/card" -
      - name: make -n prints no password
        run: |
          for key in POSTGRES_PASSWORD GTM_APP_PASSWORD; do
            secret="$(sed -n "s/^$key=//p" .env)"
            if make -n dev test up backup restore BACKUP=x | grep -qF "$secret"; then exit 1; fi
          done
      - if: failure()
        run: docker compose logs --no-color

  # The pinned Inspector CLI against the binary, on the pinned PostgreSQL: setup, demo and token new, then
  # serve's /mcp over HTTPS with each token, and mcp stdio started by the Inspector. The same sequence runs
  # against the gate in process.
  inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
        env:
          POSTGRES_USER: gtm
          POSTGRES_DB: gtm
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        # Trust authentication, so the port answers on the runner's loopback only.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm -d gtm"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GTM_TEST_DATABASE_URL: postgres://gtm@localhost:5432/gtm?sslmode=disable
      GTM_REQUIRE_DATABASE: '1'
      GTM_INSPECTOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned patch (pins.json), never the newest of a range.
          go-version: '1.27.4'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - run: go test -count=1 -run '^TestInspector$' -v ./cmd/gtm-connector ./internal/transport/mcp

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned patch (pins.json), never the newest of a range.
          go-version: '1.27.4'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: The browser checks drive the runner's installed Chrome against the build
        run: npm run test:browser
      - name: The release target builds four binaries with this web app inside them, and their sums match
        working-directory: .
        run: make release
